<div class="modal modal-open bg-base-300/50 backdrop-blur-sm">
  <div class="modal-box w-11/12 max-w-3xl p-0 overflow-hidden shadow-2xl rounded-3xl">
    
    <!-- Header -->
    <div class="bg-base-100 px-8 py-6 border-b border-base-200 flex justify-between items-center">
      <div>
        <h3 class="text-2xl font-bold text-base-content">{{ unit ? 'Edit Unit' : 'Add New Unit' }}</h3>
        <p class="text-base-content/60 text-sm mt-1">{{ unit ? 'Update unit details.' : 'Add a new unit to this property.' }}</p>
      </div>
      <button type="button" class="btn btn-sm btn-circle btn-ghost" (click)="onCancel()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>
    
    <form [formGroup]="unitForm" (ngSubmit)="onSubmit()" class="p-8 bg-base-100">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Left Column -->
        <div class="space-y-6">
          <div class="form-control w-full">
            <label class="label px-0">
              <span class="label-text font-medium text-base">Unit Number</span>
            </label>
            <input type="text" formControlName="unitNumber" placeholder="e.g. 101, 2B" class="input input-lg input-bordered w-full bg-base-200 focus:bg-base-100 transition-colors" [class.input-error]="unitForm.get('unitNumber')?.invalid && unitForm.get('unitNumber')?.touched" />
          </div>

          <div class="form-control w-full">
            <label class="label px-0">
              <span class="label-text font-medium text-base">Unit Type</span>
            </label>
            <select formControlName="type" class="select select-lg select-bordered w-full bg-base-200 focus:bg-base-100 transition-colors">
              <option value="Studio">Studio</option>
              <option value="1BHK">1BHK</option>
              <option value="2BHK">2BHK</option>
              <option value="3BHK">3BHK</option>
              <option value="Penthouse">Penthouse</option>
              <option value="Office">Office</option>
            </select>
          </div>

          <div class="form-control w-full">
            <label class="label px-0">
              <span class="label-text font-medium text-base">Monthly Rent ($)</span>
            </label>
            <input type="number" formControlName="rentAmount" placeholder="0.00" class="input input-lg input-bordered w-full bg-base-200 focus:bg-base-100 transition-colors" />
          </div>
        </div>

        <!-- Right Column -->
        <div class="space-y-6">
          <div class="form-control w-full">
            <label class="label px-0">
              <span class="label-text font-medium text-base">Occupancy Status</span>
            </label>
            <select formControlName="status" class="select select-lg select-bordered w-full bg-base-200 focus:bg-base-100 transition-colors">
              <option value="Vacant">Vacant</option>
              <option value="Occupied">Occupied</option>
              <option value="Maintenance">Maintenance</option>
            </select>
          </div>

          <div class="form-control w-full" *ngIf="unitForm.get('status')?.value === 'Occupied'">
            <label class="label px-0">
              <span class="label-text font-medium text-base">Current Tenant Name</span>
            </label>
            <input type="text" formControlName="currentTenantName" placeholder="Tenant Name" class="input input-lg input-bordered w-full bg-base-200 focus:bg-base-100 transition-colors" />
          </div>
        </div>
      </div>

      <!-- Image Upload Section -->
      <div class="form-control w-full mt-8">
        <label class="label px-0">
          <span class="label-text font-medium text-base">Unit Images</span>
        </label>
        
        <!-- Drag & Drop Area -->
        <div class="border-2 border-dashed border-base-300 rounded-2xl p-8 text-center hover:bg-base-200/50 transition-colors cursor-pointer group relative">
          <input type="file" multiple (change)="onFileSelected($event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
          <div class="flex flex-col items-center gap-2 text-base-content/60 group-hover:text-primary transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span class="text-sm font-medium">Click to upload multiple images</span>
          </div>
        </div>

        <!-- Image Previews -->
        <div class="grid grid-cols-4 gap-4 mt-4" *ngIf="mockImages.length > 0">
          <div *ngFor="let img of mockImages; let i = index" class="relative group rounded-xl overflow-hidden aspect-square border border-base-200">
            <img [src]="img" class="object-cover w-full h-full" />
            <button type="button" (click)="removeImage(i)" class="btn btn-xs btn-circle btn-error absolute top-1 right-1 opacity-0 group-hover:opacity-100 transition-opacity">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="modal-action mt-8 flex justify-end gap-3">
        <button type="button" class="btn btn-lg btn-ghost" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-lg btn-primary px-8" [disabled]="unitForm.invalid">
          {{ unit ? 'Update Unit' : 'Add Unit' }}
        </button>
      </div>
    </form>
  </div>
</div>
