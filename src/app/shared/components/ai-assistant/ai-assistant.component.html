<!-- Floating Trigger Button -->
<button class="btn btn-circle btn-lg btn-primary fixed bottom-6 right-6 shadow-lg z-50" (click)="toggleAssistant()">
  <svg *ngIf="!isOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" />
  </svg>
  <svg *ngIf="isOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
  </svg>
</button>

<!-- Assistant Panel -->
<div *ngIf="isOpen" class="fixed bottom-24 right-6 w-96 h-[500px] bg-base-100 rounded-2xl shadow-2xl z-50 flex flex-col border border-base-300">
  <!-- Header -->
  <div class="p-4 border-b border-base-200 bg-base-200/50 rounded-t-2xl flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-2 h-2 rounded-full bg-success animate-pulse"></div>
      <h3 class="font-bold">AI Assistant</h3>
    </div>
    <span class="badge badge-xs badge-ghost">Beta</span>
  </div>

  <!-- Chat Area -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4">
    <div *ngFor="let msg of messages" class="chat" [ngClass]="msg.type === 'user' ? 'chat-end' : 'chat-start'">
      <div class="chat-bubble text-sm" [ngClass]="msg.type === 'user' ? 'chat-bubble-primary' : 'chat-bubble-secondary'">
        {{ msg.text }}
      </div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="px-4 pb-2 flex gap-2 overflow-x-auto no-scrollbar">
    <button class="btn btn-xs btn-outline whitespace-nowrap" (click)="usePrompt('Predict Tenant Risk')">Predict Risk</button>
    <button class="btn btn-xs btn-outline whitespace-nowrap" (click)="usePrompt('Draft Eviction Notice')">Draft Eviction</button>
    <button class="btn btn-xs btn-outline whitespace-nowrap" (click)="usePrompt('Summarize Leases')">Summarize Leases</button>
  </div>

  <!-- Input Area -->
  <div class="p-4 border-t border-base-200">
    <div class="join w-full">
      <input type="text" [(ngModel)]="query" (keyup.enter)="sendMessage()" placeholder="Ask me anything..." class="input input-bordered join-item w-full" />
      <button class="btn btn-primary join-item" (click)="sendMessage()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
          <path d="M3.105 2.289a.75.75 0 00-.826.95l1.414 4.925A1.5 1.5 0 005.135 9.25h6.115a.75.75 0 010 1.5H5.135a1.5 1.5 0 00-1.442 1.086l-1.414 4.926a.75.75 0 00.826.95 28.896 28.896 0 0015.293-7.154.75.75 0 000-1.115A28.897 28.897 0 003.105 2.289z" />
        </svg>
      </button>
    </div>
  </div>
</div>
