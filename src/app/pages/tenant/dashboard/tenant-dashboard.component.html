<div class="p-6">
  <h1 class="text-3xl font-bold mb-6">Welcome, {{ tenantName }}! 👋</h1>

  <!-- Rent Status Card -->
  <div class="card bg-base-100 shadow-xl mb-6 border-l-4 border-primary">
    <div class="card-body">
      <div class="flex justify-between items-center">
        <div>
           <h2 class="card-title">Next Rent Due</h2>
           <p class="text-gray-500">Due on {{ rentDue.date }}</p>
        </div>
        <div class="text-right">
          <div class="text-3xl font-bold text-primary">${{ rentDue.amount }}</div>
          <div class="badge badge-warning gap-2">{{ rentDue.status }}</div>
        </div>
      </div>
      <div class="card-actions justify-end mt-4">
        <button class="btn btn-primary" routerLink="/tenant/payments/pay">Pay Now</button>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Quick Actions -->
    <div class="card bg-base-100 shadow-xl">
      <div class="card-body">
        <h2 class="card-title">Quick Actions</h2>
        <div class="grid grid-cols-2 gap-4">
          <button class="btn btn-outline" routerLink="/tenant/maintenance/report">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 mr-2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21.33a2.25 2.25 0 0 1-3.18 3.18l-5.83-6.17a2.25 2.25 0 0 1-.65-1.59V12.4l-2.25-2.25a2.25 2.25 0 1 1 3.18-3.18l2.25 2.25h4.36a2.25 2.25 0 0 1 1.59.65l6.17 5.83a2.25 2.25 0 0 1-3.18 3.18l-6.17-5.83" />
            </svg>
            Report Issue
          </button>
          <button class="btn btn-outline" routerLink="/tenant/contract">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 mr-2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
            View Contract
          </button>
           <button class="btn btn-outline" routerLink="/tenant/payments">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 mr-2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z" />
            </svg>
            Payment History
          </button>
          <button class="btn btn-outline" routerLink="/tenant/ai">
             <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 mr-2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z" />
            </svg>
            Ask Assistant
          </button>
        </div>
      </div>
    </div>

    <!-- Active Tickets -->
    <div class="card bg-base-100 shadow-xl">
      <div class="card-body">
        <h2 class="card-title">Active Maintenance Tickets</h2>
        <div class="overflow-x-auto">
          <table class="table w-full">
            <tbody>
              <tr *ngFor="let ticket of activeTickets">
                <td>{{ ticket.title }}</td>
                <td><span class="badge badge-info badge-sm">{{ ticket.status }}</span></td>
                <td class="text-right">
                  <a [routerLink]="['/tenant/maintenance/tickets', ticket.id]" class="btn btn-ghost btn-xs">View</a>
                </td>
              </tr>
              <tr *ngIf="activeTickets.length === 0">
                <td colspan="3" class="text-center text-gray-500">No active tickets.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
