<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card w-full max-w-md shadow-2xl bg-base-100">
    <div class="card-body">
      <h2 class="card-title justify-center text-3xl font-bold mb-6 text-primary">Register</h2>
      
      <div class="tabs tabs-boxed mb-6 grid grid-cols-2">
        <a class="tab" [class.tab-active]="role === 'tenant'" (click)="role = 'tenant'">Tenant</a> 
        <a class="tab" [class.tab-active]="role === 'landlord'" (click)="role = 'landlord'">Landlord</a>
      </div>

      <form class="space-y-4">
        <div class="form-control w-full">
          <label class="label">
            <span class="label-text font-medium">Full Name</span>
          </label>
          <input type="text" placeholder="John Doe" class="input input-bordered w-full" required />
        </div>

        <div class="form-control w-full">
          <label class="label">
            <span class="label-text font-medium">Email</span>
          </label>
          <input type="email" placeholder="email@example.com" class="input input-bordered w-full" required />
        </div>

        <div class="form-control w-full">
          <label class="label">
            <span class="label-text font-medium">Password</span>
          </label>
          <input type="password" placeholder="********" class="input input-bordered w-full" required />
        </div>

        <div class="form-control">
          <label class="label cursor-pointer justify-start gap-3">
            <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" />
            <span class="label-text">I agree to terms and conditions</span>
          </label>
        </div>

        <div class="form-control mt-6">
          <button class="btn btn-primary w-full">Sign Up as {{ role | titlecase }}</button>
        </div>
        
        <div class="text-center mt-6">
          <span class="text-sm">Already have an account? </span>
          <a routerLink="/login" class="link link-primary text-sm font-bold no-underline hover:underline">Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
