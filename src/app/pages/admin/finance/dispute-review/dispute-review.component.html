<div class="p-6">
  <div class="text-sm breadcrumbs mb-4">
    <ul>
      <li><a routerLink="/admin/finance">Finance</a></li>
      <li>Disputes</li>
    </ul>
  </div>
  <h1 class="text-3xl font-bold mb-6">Adjustment & Dispute Review</h1>

  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <div class="overflow-x-auto">
        <table class="table">
          <thead>
            <tr>
              <th>Dispute ID</th>
              <th>Raised By</th>
              <th>Type</th>
              <th>Disputed Amount</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let dispute of disputes" class="hover">
              <td class="font-mono">{{ dispute.id }}</td>
              <td>{{ dispute.raisedBy }}</td>
              <td>{{ dispute.type }}</td>
              <td class="font-bold text-error">${{ dispute.amount }}</td>
              <td>{{ dispute.date }}</td>
              <td>
                 <div class="badge" [ngClass]="{
                  'badge-warning': dispute.status === 'Open',
                  'badge-info': dispute.status === 'Under Review',
                  'badge-success': dispute.status === 'Resolved'
                }">{{ dispute.status }}</div>
              </td>
              <td>
                <button class="btn btn-primary btn-xs">Review</button>
                <button class="btn btn-ghost btn-xs">Dismiss</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
