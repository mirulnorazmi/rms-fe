<div class="p-6 h-[calc(100vh-4rem)] flex flex-col">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Maintenance Board</h1>
    <button class="btn btn-primary">New Ticket</button>
  </div>

  <div class="flex gap-4 overflow-x-auto h-full pb-4">
    <div *ngFor="let col of columns" class="min-w-[300px] bg-base-200 rounded-box p-4 flex flex-col">
      <div class="font-bold mb-4 flex justify-between items-center">
        {{ col.title }}
        <span class="badge badge-sm">{{ col.tickets.length }}</span>
      </div>
      
      <div class="flex-1 overflow-y-auto space-y-3">
        <div *ngFor="let ticket of col.tickets" class="card bg-base-100 shadow-sm hover:shadow-md cursor-pointer">
          <div class="card-body p-4">
            <div class="flex justify-between items-start mb-2">
              <span class="text-xs opacity-50 font-mono">{{ ticket.id }}</span>
              <div class="badge badge-xs" [ngClass]="{
                'badge-success': ticket.priority === 'Low',
                'badge-warning': ticket.priority === 'Normal',
                'badge-error': ticket.priority === 'High'
              }">{{ ticket.priority }}</div>
            </div>
            <h3 class="font-bold">{{ ticket.title }}</h3>
            <p class="text-xs opacity-70">{{ ticket.property }}</p>
            <div *ngIf="ticket.tech" class="mt-2 flex items-center gap-2">
               <div class="avatar placeholder">
                  <div class="bg-neutral-focus text-neutral-content rounded-full w-6 h-6 bg-gray-300 flex items-center justify-center text-xs">
                    <span>{{ ticket.tech.charAt(0) }}</span>
                  </div>
               </div>
               <span class="text-xs">{{ ticket.tech }}</span>
            </div>
          </div>
        </div>
        <div *ngIf="col.tickets.length === 0" class="text-center p-4 opacity-50 text-sm border-2 border-dashed border-base-300 rounded-lg">
          No tickets
        </div>
      </div>
    </div>
  </div>
</div>
