<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Tenants</h1>
    <a routerLink="onboarding" class="btn btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 mr-2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3.75 15h2.25c4.28 0 7.2-2.82 7.2-7.2V15m0 0h2.25m-2.25 0a2.25 2.25 0 1 1 4.5 0 2.25 2.25 0 0 1-4.5 0Z" />
      </svg>
      Onboard Tenant
    </a>
  </div>

  <div class="overflow-x-auto bg-base-100 shadow-xl rounded-box">
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Property / Unit</th>
          <th>Contact</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let tenant of tenants" class="hover">
          <td>
            <div class="flex items-center gap-3">
              <div class="avatar placeholder">
                <div class="bg-neutral-focus text-neutral-content rounded-full w-10 h-10 bg-gray-300 flex items-center justify-center">
                  <span>{{ tenant.name.charAt(0) }}</span>
                </div>
              </div>
              <div class="font-bold">{{ tenant.name }}</div>
            </div>
          </td>
          <td>{{ tenant.property }}</td>
          <td>
            <div class="text-sm">{{ tenant.email }}</div>
            <div class="text-xs opacity-50">{{ tenant.phone }}</div>
          </td>
          <td>
            <div class="badge" [ngClass]="{
              'badge-success': tenant.status === 'Active',
              'badge-warning': tenant.status === 'Pending',
              'badge-ghost': tenant.status === 'Past'
            }">{{ tenant.status }}</div>
          </td>
          <td>
            <a [routerLink]="['/landlord/tenants', tenant.id]" class="btn btn-sm btn-ghost">View</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
