<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Payment History</h1>
  </div>

  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <div class="overflow-x-auto">
        <table class="table">
          <thead>
            <tr>
              <th>Invoice ID</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Due Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let invoice of invoices">
              <td>{{ invoice.id }}</td>
              <td>{{ invoice.date }}</td>
              <td>${{ invoice.amount }}</td>
              <td>
                <div class="badge" [ngClass]="{
                  'badge-success': invoice.status === 'Paid',
                  'badge-warning': invoice.status === 'Unpaid'
                }">{{ invoice.status }}</div>
              </td>
              <td>{{ invoice.dueDate }}</td>
              <td>
                <a *ngIf="invoice.status === 'Unpaid'" routerLink="/tenant/payments/pay" class="btn btn-primary btn-xs">Pay Now</a>
                <a *ngIf="invoice.status === 'Paid'" [routerLink]="['/tenant/payments/receipt', invoice.id]" class="btn btn-ghost btn-xs">Receipt</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
