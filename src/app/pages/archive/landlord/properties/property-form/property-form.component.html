<div class="p-6 max-w-2xl mx-auto">
  <div class="text-sm breadcrumbs mb-4">
    <ul>
      <li><a routerLink="/landlord/properties">Properties</a></li>
      <li>Add Property</li>
    </ul>
  </div>

  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl font-bold mb-6">Add New Property</h2>
      
      <form (ngSubmit)="saveProperty()">
        <div class="form-control w-full mb-4">
          <label class="label">
            <span class="label-text">Property Name</span>
          </label>
          <input type="text" placeholder="e.g. Sunset Apartments" class="input input-bordered w-full" [(ngModel)]="property.name" name="name" required />
        </div>

        <div class="form-control w-full mb-4">
          <label class="label">
            <span class="label-text">Address</span>
          </label>
          <textarea class="textarea textarea-bordered h-24" placeholder="Property Address" [(ngModel)]="property.address" name="address"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="form-control w-full">
            <label class="label">
              <span class="label-text">Property Type</span>
            </label>
            <select class="select select-bordered" [(ngModel)]="property.type" name="type">
              <option>Apartment</option>
              <option>House</option>
              <option>Condo</option>
              <option>Commercial</option>
            </select>
          </div>
          <div class="form-control w-full">
             <label class="label">
              <span class="label-text">Number of Units</span>
            </label>
            <input type="number" class="input input-bordered" [(ngModel)]="property.units" name="units" />
          </div>
        </div>

        <div class="card-actions justify-end">
          <button type="button" class="btn" routerLink="/landlord/properties">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Property</button>
        </div>
      </form>
    </div>
  </div>
</div>
