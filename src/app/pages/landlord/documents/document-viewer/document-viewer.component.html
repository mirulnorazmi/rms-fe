<div class="p-6 space-y-6 h-screen flex flex-col">
  <div class="text-sm breadcrumbs">
    <ul>
      <li><a routerLink="/landlord/dashboard">Dashboard</a></li>
      <li><a routerLink="/landlord/documents">Documents</a></li>
      <li>{{ document.name }}</li>
    </ul>
  </div>

  <div class="card bg-base-100 shadow-xl flex-grow flex flex-col overflow-hidden">
    <div class="bg-base-200 px-6 py-4 flex justify-between items-center border-b border-base-300">
      <div>
        <h2 class="text-lg font-bold">{{ document.name }}</h2>
        <p class="text-xs opacity-60">{{ document.type }} • {{ document.size }} • Uploaded on {{ document.date }}</p>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-sm btn-ghost">Print</button>
        <button class="btn btn-sm btn-primary">Download</button>
      </div>
    </div>
    
    <div class="flex-grow bg-base-300/50 flex items-center justify-center p-8 overflow-auto">
      <!-- Placeholder for PDF Viewer -->
      <div class="bg-white shadow-lg w-full max-w-3xl h-full min-h-[500px] flex items-center justify-center border border-base-300">
        <div class="text-center opacity-50">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 mx-auto mb-4"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" /></svg>
          <p class="text-lg font-medium">Document Preview</p>
          <p class="text-sm">PDF rendering would happen here.</p>
        </div>
      </div>
    </div>
  </div>
</div>
