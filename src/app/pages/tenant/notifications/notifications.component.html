<div class="p-6 space-y-6 max-w-4xl mx-auto">
  <!-- Header -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <div class="text-sm breadcrumbs text-base-content/60 mb-1">
        <ul>
          <li><a routerLink="/tenant/dashboard">Dashboard</a></li>
          <li>Notifications</li>
        </ul>
      </div>
      <h1 class="text-3xl font-bold text-base-content">Notifications</h1>
      <p class="text-base-content/60 mt-1">Stay updated with important alerts and reminders.</p>
    </div>
    
    <button class="btn btn-ghost btn-sm" (click)="markAllAsRead()">Mark all as read</button>
  </div>

  <!-- Notification List -->
  <div class="space-y-4">
    <div *ngFor="let notif of notifications" 
         class="alert shadow-sm border border-base-200 transition-all duration-200"
         [ngClass]="{
           'bg-base-100': notif.read,
           'bg-base-200/50 border-l-4 border-l-primary': !notif.read
         }">
      
      <!-- Icon & Content -->
      <div class="flex-1 flex items-start gap-4">
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl shrink-0"
             [ngClass]="{
               'bg-error/10 text-error': notif.priority === 'high',
               'bg-info/10 text-info': notif.priority === 'medium',
               'bg-base-300/50 text-base-content/70': notif.priority === 'low'
             }">
          {{ getIcon(notif.type) }}
        </div>
        
        <div class="space-y-1">
          <div class="flex items-center gap-2">
            <h3 class="font-bold text-base-content">{{ notif.title }}</h3>
            <span *ngIf="!notif.read" class="badge badge-xs badge-primary">New</span>
          </div>
          <p class="text-sm text-base-content/80">{{ notif.message }}</p>
          <p class="text-xs text-base-content/50">{{ notif.time }}</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2">
        <button *ngIf="!notif.read" class="btn btn-ghost btn-xs" (click)="markAsRead(notif.id)">
          <span class="hidden sm:inline">Mark Read</span>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 sm:hidden">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
          </svg>
        </button>
        <button class="btn btn-ghost btn-xs text-base-content/40 hover:text-error" (click)="deleteNotification(notif.id)">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="notifications.length === 0" class="text-center py-12 opacity-50">
      <div class="text-4xl mb-4">📭</div>
      <p class="font-medium">No notifications</p>
      <p class="text-sm">You're all caught up!</p>
    </div>
  </div>
</div>
