<div class="min-h-screen bg-base-200 flex items-center justify-center px-4">
  <div class="max-w-2xl w-full text-center">
    <!-- 404 Illustration -->
    <div class="mb-8">
      <h1 class="text-9xl font-bold text-primary/20">404</h1>
    </div>

    <!-- Error Message -->
    <div class="mb-8">
      <h2 class="text-4xl font-bold text-base-content mb-4">
        Page Not Found
      </h2>
      <p class="text-lg text-base-content/70 mb-2">
        Oops! The page you're looking for doesn't exist.
      </p>
      <p class="text-base text-base-content/60">
        It might have been moved or deleted, or you may have mistyped the URL.
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
      <button 
        (click)="goHome()" 
        class="btn btn-primary btn-lg px-8">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Go to Home
      </button>

      <button 
        (click)="goBack()" 
        class="btn btn-outline btn-lg px-8">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Go Back
      </button>
    </div>

    <!-- Additional Help Links -->
    <div class="mt-12 pt-8 border-t border-base-300">
      <p class="text-sm text-base-content/60 mb-4">
        Need help? Here are some useful links:
      </p>
      <div class="flex flex-wrap justify-center gap-4">
        <a routerLink="/login" class="link link-primary text-sm">Login</a>
        <a routerLink="/register" class="link link-primary text-sm">Register</a>
      </div>
    </div>
  </div>
</div>
