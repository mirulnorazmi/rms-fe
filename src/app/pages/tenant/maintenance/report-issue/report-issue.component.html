<div class="p-6 max-w-2xl mx-auto">
  <div class="text-sm breadcrumbs mb-4">
    <ul>
      <li><a routerLink="/tenant/maintenance/tickets">Maintenance</a></li>
      <li>Report Issue</li>
    </ul>
  </div>

  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-2xl font-bold mb-6">Report a Maintenance Issue</h1>
      
      <form (ngSubmit)="submitIssue()">
        <div class="form-control w-full mb-4">
          <label class="label"><span class="label-text">Issue Category</span></label>
          <select class="select select-bordered" [(ngModel)]="issue.category" name="category" required>
            <option disabled selected value="">Pick a category</option>
            <option>Plumbing</option>
            <option>Electrical</option>
            <option>Appliance</option>
            <option>Structural</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-control w-full mb-4">
          <label class="label"><span class="label-text">Title</span></label>
          <input type="text" placeholder="Brief summary (e.g. Leaky faucet)" class="input input-bordered w-full" [(ngModel)]="issue.title" name="title" required />
        </div>

        <div class="form-control w-full mb-4">
          <label class="label"><span class="label-text">Description</span></label>
          <textarea class="textarea textarea-bordered h-32" placeholder="Detailed description of the problem..." [(ngModel)]="issue.description" name="description" required></textarea>
        </div>

        <div class="form-control w-full mb-4">
          <label class="label"><span class="label-text">Priority</span></label>
          <div class="flex gap-4">
            <label class="label cursor-pointer gap-2">
              <input type="radio" name="priority" class="radio radio-success" value="Low" [(ngModel)]="issue.priority" />
              <span class="label-text">Low</span>
            </label>
            <label class="label cursor-pointer gap-2">
              <input type="radio" name="priority" class="radio radio-info" value="Normal" [(ngModel)]="issue.priority" />
              <span class="label-text">Normal</span>
            </label>
            <label class="label cursor-pointer gap-2">
              <input type="radio" name="priority" class="radio radio-error" value="High" [(ngModel)]="issue.priority" />
              <span class="label-text">High (Emergency)</span>
            </label>
          </div>
        </div>

        <div class="form-control w-full mb-6">
          <label class="label"><span class="label-text">Upload Photos/Videos</span></label>
          <input type="file" class="file-input file-input-bordered w-full" multiple />
        </div>

        <div class="card-actions justify-end">
          <button type="button" class="btn" routerLink="/tenant/dashboard">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Request</button>
        </div>
      </form>
    </div>
  </div>
</div>
