<div class="p-6 max-w-lg mx-auto">
  <div class="text-sm breadcrumbs mb-4">
    <ul>
      <li><a routerLink="/tenant/payments">Payments</a></li>
      <li>Pay Rent</li>
    </ul>
  </div>

  <div class="card bg-base-100 shadow-xl" *ngIf="!success; else successTemplate">
    <div class="card-body">
      <h2 class="card-title text-2xl font-bold mb-6">Make a Payment</h2>
      
      <div class="flex justify-between mb-4 text-lg">
        <span>Total Amount Due:</span>
        <span class="font-bold">${{ amount }}</span>
      </div>

      <form (ngSubmit)="processPayment()">
        <div class="form-control w-full mb-4">
          <label class="label"><span class="label-text">Payment Method</span></label>
          <select class="select select-bordered" [(ngModel)]="paymentMethod" name="paymentMethod">
            <option value="credit_card">Credit Card</option>
            <option value="bank_transfer">Bank Transfer</option>
          </select>
        </div>

        <div *ngIf="paymentMethod === 'credit_card'">
          <div class="form-control w-full mb-4">
            <label class="label"><span class="label-text">Card Number</span></label>
            <input type="text" placeholder="0000 0000 0000 0000" class="input input-bordered w-full" />
          </div>
          <div class="grid grid-cols-2 gap-4 mb-4">
             <div class="form-control w-full">
              <label class="label"><span class="label-text">Expiry</span></label>
              <input type="text" placeholder="MM/YY" class="input input-bordered w-full" />
            </div>
             <div class="form-control w-full">
              <label class="label"><span class="label-text">CVC</span></label>
              <input type="text" placeholder="123" class="input input-bordered w-full" />
            </div>
          </div>
        </div>

        <div class="card-actions justify-end mt-6">
          <button type="submit" class="btn btn-primary w-full" [disabled]="processing">
            <span *ngIf="processing" class="loading loading-spinner"></span>
            {{ processing ? 'Processing...' : 'Pay $' + amount }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <ng-template #successTemplate>
    <div class="card bg-base-100 shadow-xl text-center">
      <div class="card-body">
        <div class="flex justify-center mb-4">
          <div class="rounded-full bg-green-100 p-4">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 text-success">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
          </div>
        </div>
        <h2 class="text-2xl font-bold text-success mb-2">Payment Successful!</h2>
        <p class="text-gray-500 mb-6">Your payment of ${{ amount }} has been processed.</p>
        <div class="flex gap-2 justify-center">
          <button class="btn btn-primary" routerLink="/tenant/dashboard">Back to Dashboard</button>
          <button class="btn btn-outline" routerLink="/tenant/payments/receipt/123">View Receipt</button>
        </div>
      </div>
    </div>
  </ng-template>
</div>
