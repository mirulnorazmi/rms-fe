<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card w-full max-w-sm shadow-2xl bg-base-100">
    <div class="card-body">
      <h2 class="card-title justify-center text-3xl font-bold mb-6 text-primary">Login</h2>
      
      <form class="space-y-4">
        <div class="form-control w-full">
          <label class="label">
            <span class="label-text font-medium">Email or Phone</span>
          </label>
          <input type="text" placeholder="email@example.com" class="input input-bordered w-full" />
        </div>

        <div class="form-control w-full">
          <label class="label">
            <span class="label-text font-medium">Password</span>
          </label>
          <input type="password" placeholder="Enter password" class="input input-bordered w-full" />
          <label class="label justify-end">
            <a href="#" class="label-text-alt link link-hover text-primary">Forgot password?</a>
          </label>
        </div>

        <div class="form-control mt-6">
          <button class="btn btn-primary w-full" type="button">Login</button>
        </div>
        
        <!-- Demo Login Section -->
        <div class="divider my-6">Demo Login</div>
        <div class="space-y-3">
            <button type="button" (click)="loginAs('landlord')" class="btn btn-outline btn-secondary w-full">Login as Landlord</button>
            <button type="button" (click)="loginAs('tenant')" class="btn btn-outline btn-accent w-full">Login as Tenant</button>
            <button type="button" (click)="loginAs('admin')" class="btn btn-outline btn-accent w-full">Login as Admin</button>
            <button type="button" (click)="loginAs('guest')" class="btn btn-ghost btn-sm w-full">Continue as Guest</button>
        </div>

        <div class="text-center mt-6">
          <span class="text-sm">Don't have an account? </span>
          <a routerLink="/register" class="link link-primary text-sm font-bold no-underline hover:underline">Register</a>
        </div>
      </form>
    </div>
  </div>
</div>
