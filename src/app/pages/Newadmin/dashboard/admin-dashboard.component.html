<div class="p-6">
  <h1 class="text-2xl font-bold mb-6">Admin Dashboard</h1>
  
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <div *ngFor="let stat of stats" class="stats shadow bg-base-100">
      <div class="stat">
        <div class="stat-figure text-{{stat.color}}">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-8 h-8 stroke-current"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <div class="stat-title">{{ stat.title }}</div>
        <div class="stat-value text-{{stat.color}}">{{ stat.value }}</div>
        <div class="stat-desc">{{ stat.desc }}</div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="card bg-base-100 shadow-xl">
      <div class="card-body">
        <h2 class="card-title">Recent Activity</h2>
        <ul class="steps steps-vertical">
          <li class="step step-primary">New Landlord Registered: John Doe</li>
          <li class="step step-primary">Subscription Renewed: Apex Realty</li>
          <li class="step">System Update Scheduled</li>
          <li class="step">Maintenance Alert: Server 2</li>
        </ul>
      </div>
    </div>

    <div class="card bg-base-100 shadow-xl">
      <div class="card-body">
        <h2 class="card-title">Booking Health</h2>
        <div class="radial-progress text-success" style="--value:98;" role="progressbar">98%</div>
        <p>Successful Bookings</p>
        <div class="alert alert-warning mt-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
            <span>2 Failed Syncs with Airbnb</span>
        </div>
      </div>
    </div>
  </div>
</div>
