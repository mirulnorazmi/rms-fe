<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Contracts</h1>
    <a routerLink="create" class="btn btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 mr-2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
      </svg>
      Create Contract
    </a>
  </div>

  <div class="overflow-x-auto bg-base-100 shadow-xl rounded-box">
    <table class="table">
      <thead>
        <tr>
          <th>Tenant</th>
          <th>Property</th>
          <th>Duration</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let contract of contracts" class="hover">
          <td class="font-bold">{{ contract.tenant }}</td>
          <td>{{ contract.property }}</td>
          <td>
            <div class="text-sm">{{ contract.startDate }} to {{ contract.endDate }}</div>
          </td>
          <td>
            <div class="badge" [ngClass]="{
              'badge-success': contract.status === 'Active',
              'badge-error': contract.status === 'Expired',
              'badge-warning': contract.status === 'Pending'
            }">{{ contract.status }}</div>
          </td>
          <td>
            <a [routerLink]="['/landlord/contracts', contract.id]" class="btn btn-sm btn-ghost">Details</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
