<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Maintenance Requests</h1>
    <a routerLink="/tenant/maintenance/report" class="btn btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 mr-2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      New Request
    </a>
  </div>

  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <div class="overflow-x-auto">
        <table class="table">
          <thead>
            <tr>
              <th>Ticket ID</th>
              <th>Title</th>
              <th>Category</th>
              <th>Date Reported</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let ticket of tickets" class="hover">
              <td>{{ ticket.id }}</td>
              <td class="font-bold">{{ ticket.title }}</td>
              <td>{{ ticket.category }}</td>
              <td>{{ ticket.date }}</td>
              <td>
                <div class="badge" [ngClass]="{
                  'badge-success': ticket.priority === 'Low',
                  'badge-info': ticket.priority === 'Normal',
                  'badge-error': ticket.priority === 'High'
                }">{{ ticket.priority }}</div>
              </td>
              <td>
                 <div class="badge badge-outline" [ngClass]="{
                  'badge-success': ticket.status === 'Closed',
                  'badge-warning': ticket.status === 'In Progress',
                  'badge-ghost': ticket.status === 'Open'
                }">{{ ticket.status }}</div>
              </td>
              <td>
                <a [routerLink]="['/tenant/maintenance/tickets', ticket.id]" class="btn btn-ghost btn-xs">View Details</a>
              </td>
            </tr>
             <tr *ngIf="tickets.length === 0">
                <td colspan="7" class="text-center py-4 text-gray-500">No maintenance tickets found.</td>
              </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
