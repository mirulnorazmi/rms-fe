<div class="p-6 max-w-2xl mx-auto">
  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <div class="flex justify-between items-center mb-6">
         <h2 class="card-title text-3xl font-bold">User Profile</h2>
         <button class="btn btn-circle btn-ghost" (click)="toggleEdit()">
           <svg *ngIf="!isEditing" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
            </svg>
            <svg *ngIf="isEditing" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
         </button>
      </div>

      <div class="flex flex-col items-center mb-6">
        <div class="avatar placeholder mb-4">
          <div class="bg-neutral text-neutral-content rounded-full w-24">
            <span class="text-3xl">{{ user.name.charAt(0) }}</span>
          </div>
        </div>
        <div class="badge badge-primary badge-lg">{{ user.role }}</div>
      </div>

      <form (ngSubmit)="saveProfile()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="form-control">
            <label class="label"><span class="label-text">Full Name</span></label>
            <input type="text" [(ngModel)]="user.name" name="name" [disabled]="!isEditing" class="input input-bordered" />
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text">Email</span></label>
            <input type="email" [(ngModel)]="user.email" name="email" [disabled]="!isEditing" class="input input-bordered" />
          </div>
           <div class="form-control">
            <label class="label"><span class="label-text">Phone</span></label>
            <input type="text" [(ngModel)]="user.phone" name="phone" [disabled]="!isEditing" class="input input-bordered" />
          </div>
           <div class="form-control">
            <label class="label"><span class="label-text">Address</span></label>
            <input type="text" [(ngModel)]="user.address" name="address" [disabled]="!isEditing" class="input input-bordered" />
          </div>
        </div>
        
        <div class="card-actions justify-end mt-6" *ngIf="isEditing">
          <button type="button" class="btn" (click)="isEditing = false">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
